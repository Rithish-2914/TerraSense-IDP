<svg width="340" height="90" viewBox="0 0 340 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="idp_grad_blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="idp_grad_accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Icon: Modern Geometric Planet & Orbital Ring -->
  <g transform="translate(10, 8)">
    <!-- Outer Orbit Ring -->
    <ellipse cx="37" cy="37" rx="34" ry="14" transform="rotate(-28 37 37)" stroke="url(#idp_grad_accent)" stroke-width="3" fill="none" stroke-dasharray="140 10" opacity="0.85"/>
    
    <!-- Central Digital Sphere -->
    <circle cx="37" cy="37" r="22" fill="#0F172A" stroke="url(#idp_grad_blue)" stroke-width="2.5"/>
    <circle cx="37" cy="37" r="17" fill="url(#idp_grad_blue)" opacity="0.3"/>
    
    <!-- Latitude / Longitude lines inside globe -->
    <ellipse cx="37" cy="37" rx="10" ry="21" stroke="#38BDF8" stroke-width="1.5" fill="none" opacity="0.75"/>
    <line x1="16" y1="37" x2="58" y2="37" stroke="#38BDF8" stroke-width="1.5" opacity="0.75"/>
    
    <!-- Orbit Satellite Node -->
    <circle cx="64" cy="24" r="4.5" fill="#00E5FF" filter="url(#glow)"/>
    <circle cx="64" cy="24" r="2" fill="#FFFFFF"/>
    
    <!-- Small accent pulse node -->
    <circle cx="10" cy="50" r="3" fill="#38BDF8"/>
  </g>

  <!-- Typography: TERRASENSE / INNOVATIVE DESIGN PROJECT -->
  <g transform="translate(95, 14)">
    <!-- Main Wordmark -->
    <text x="0" y="38" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="34" font-weight="800" fill="#0F172A" letter-spacing="1px">
      TERRA<tspan fill="url(#idp_grad_blue)">SENSE</tspan>
    </text>
    
    <!-- Subtitle Badge -->
    <rect x="0" y="48" width="46" height="18" rx="4" fill="#0F172A"/>
    <text x="8" y="61" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11" font-weight="800" fill="#38BDF8" letter-spacing="1px">IDP</text>
    
    <text x="54" y="61" font-family="'Segoe UI', -apple-system, sans-serif" font-size="10" font-weight="700" fill="#64748B" letter-spacing="1px">
      INNOVATIVE DESIGN PROJECT
    </text>
  </g>
</svg>
