<svg width="320" height="90" viewBox="0 0 320 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="wehack_grad_blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0042A6"/>
      <stop offset="50%" stop-color="#2E96F5"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>
    <linearGradient id="wehack_grad_accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E96F5"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Icon: Modern Geometric Planet & Orbital Ring -->
  <g transform="translate(10, 8)">
    <!-- Outer Orbit Ring -->
    <ellipse cx="37" cy="37" rx="34" ry="14" transform="rotate(-28 37 37)" stroke="url(#wehack_grad_accent)" stroke-width="3" fill="none" stroke-dasharray="140 10" opacity="0.85"/>
    
    <!-- Central Digital Sphere -->
    <circle cx="37" cy="37" r="22" fill="#07173F" stroke="url(#wehack_grad_blue)" stroke-width="2.5"/>
    <circle cx="37" cy="37" r="17" fill="url(#wehack_grad_blue)" opacity="0.3"/>
    
    <!-- Latitude / Longitude lines inside globe -->
    <ellipse cx="37" cy="37" rx="10" ry="21" stroke="#2E96F5" stroke-width="1.5" fill="none" opacity="0.75"/>
    <line x1="16" y1="37" x2="58" y2="37" stroke="#2E96F5" stroke-width="1.5" opacity="0.75"/>
    
    <!-- Orbit Satellite Node -->
    <circle cx="64" cy="24" r="4.5" fill="#00E5FF" filter="url(#glow)"/>
    <circle cx="64" cy="24" r="2" fill="#FFFFFF"/>
    
    <!-- Small accent pulse node -->
    <circle cx="10" cy="50" r="3" fill="#2E96F5"/>
  </g>

  <!-- Typography: WEHACK -->
  <g transform="translate(95, 12)">
    <!-- Main Wordmark -->
    <text x="0" y="42" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Montserrat', sans-serif" font-size="44" font-weight="900" fill="#07173F" letter-spacing="1.5px">
      WE<tspan fill="url(#wehack_grad_blue)">HACK</tspan>
    </text>
    
    <!-- Year & Subtitle Badge -->
    <rect x="1" y="52" width="70" height="18" rx="4" fill="#07173F"/>
    <text x="10" y="65" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11" font-weight="800" fill="#00E5FF" letter-spacing="1px">2026</text>
    
    <text x="78" y="65" font-family="'Segoe UI', -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#5A6E85" letter-spacing="1.2px">
      CLIMATE DIGITAL TWIN
    </text>
  </g>
</svg>
